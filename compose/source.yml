x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - imperium-net

services:

  news-source-db:
    <<: *service-defaults
    image: postgres:13
    container_name: imperium-news-source-db
    hostname: news-source-db
    profiles:
      - source
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "${SOURCE_PG_EXTERNAL_PORT:-35432}:5432"
    environment:
      POSTGRES_DB: ${SOURCE_PG_DATABASE:-imperium-news-source}
      POSTGRES_USER: ${SOURCE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${SOURCE_PG_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_PG_USER:-postgres} -d ${SOURCE_PG_DATABASE:-imperium-news-source}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - source-db:/var/lib/postgresql/data
      - ../infrastructure/postgres/initdb:/docker-entrypoint-initdb.d:ro

  elasticsearch:
    <<: *service-defaults
    image: ${ELASTICSEARCH_IMAGE}
    container_name: imperium-elasticsearch
    hostname: elasticsearch
    profiles:
      - source
    ports:
      - "${ELASTICSEARCH_EXTERNAL_PORT:-49200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g} -javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: elasticsearch
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=imperium-local,service.namespace=source
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ${PWD}/obser/otel/otel-javaagent.jar:/otel/otel-javaagent.jar:ro

  clone-news:
    <<: *service-defaults
    build:
      context: ../infrastructure/docker/clone-news
    container_name: imperium-clone-news
    profiles:
      - migration
    volumes:
      - ..:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - clone-news-state:/app/scripts/clone/.state
    environment:
      SOURCE_PG_CONTAINER: ${SOURCE_PG_CONTAINER:-imperium-news-source-db}
    depends_on:
      news-source-db:
        condition: service_healthy

  clone-old-news:
    <<: *service-defaults
    build:
      context: ../infrastructure/docker/clone-news
    container_name: imperium-clone-old-news
    restart: "no"
    profiles:
      - migration
    command: ["python", "scripts/clone/old_scheduler.py"]
    volumes:
      - ..:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - clone-old-news-state:/app/scripts/clone/.state
    environment:
      SOURCE_PG_CONTAINER: ${SOURCE_PG_CONTAINER:-imperium-news-source-db}
      CLONE_OLD_SEED_ID: ${CLONE_OLD_SEED_ID:-564990395}
      CLONE_OLD_BATCH_SIZE: ${CLONE_OLD_BATCH_SIZE:-100000}
      CLONE_OLD_INTERVAL: ${CLONE_OLD_INTERVAL:-60}
    depends_on:
      news-source-db:
        condition: service_healthy
