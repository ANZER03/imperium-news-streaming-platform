x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - imperium-net

services:
  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE}
    container_name: imperium-redis
    hostname: redis
    profiles:
      - serving
    ports:
      - "${REDIS_EXTERNAL_PORT:-46379}:6379"
    command: >
      redis-server 
      --save 60 1 
      --loglevel warning 
      --appendonly yes 
      --appendfsync everysec 
      --auto-aof-rewrite-percentage 100 
      --auto-aof-rewrite-min-size 64mb 
      --aof-use-rdb-preamble yes 
      --maxmemory 4gb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  qdrant:
    <<: *service-defaults
    image: ${QDRANT_IMAGE}
    container_name: imperium-qdrant
    hostname: qdrant
    profiles:
      - serving
    ports:
      - "${QDRANT_HTTP_EXTERNAL_PORT:-46333}:6333"
      - "${QDRANT_GRPC_EXTERNAL_PORT:-46334}:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MEMMAP_THRESHOLD_KB: "200000"

    volumes:
      - qdrant-data:/qdrant/storage

  llama-cpp:
    <<: *service-defaults
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: imperium-llama-cpp
    hostname: llama-cpp
    profiles:
      - serving
    ports:
      - "18080:8080"
    volumes:
      - ../models:/models:ro
    command:
      - -m
      - /models/embeddinggemma-300M-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --embeddings
      - --threads
      - "32"
      - --threads-batch
      - "32"
      - --batch-size
      - "8192"
      - --ubatch-size
      - "2048"
      - --log-disable
      - -lv
      - "-1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
