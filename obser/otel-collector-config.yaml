receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

  resource:
    attributes:
      - key: deployment.environment
        value: imperium-local
        action: upsert

  batch:
    send_batch_size: 10000
    timeout: 5s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: default
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    logs_table_name: otel_logs
    metrics_table_name: otel_metrics
    traces_table_name: otel_traces
    ttl: 72h
    create_schema: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: :13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [clickhouse, debug]

    logs:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [clickhouse, debug]

    traces:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [clickhouse, debug]
